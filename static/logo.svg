<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none" stroke="currentColor">
    <!-- Base/Rocks -->
    <path d="M 20 110 Q 50 100 80 110 L 80 115 L 20 115 Z" fill="#1b1b22" stroke="#252530" stroke-width="1.5" />
    <!-- Foundation -->
    <rect x="35" y="90" width="30" height="15" rx="1.5" fill="#2d2d3a" stroke="#3d3d4e" stroke-width="1.5" />
    <!-- Tower body -->
    <path d="M 38 90 L 43 35 L 57 35 L 62 90 Z" fill="url(#towerGradientHeader)" stroke="#4a4a5e" stroke-width="1.5" />
    <!-- Gallery deck -->
    <rect x="40" y="31" width="20" height="4" rx="1" fill="#1b1b22" stroke="#252530" stroke-width="1.5" />
    <!-- Lantern Room -->
    <rect x="44" y="19" width="12" height="12" rx="1" fill="rgba(191, 90, 242, 0.15)" stroke="#bf5af2" stroke-width="1.5" />
    <line x1="50" y1="19" x2="50" y2="31" stroke="#bf5af2" stroke-width="1.5" />
    <!-- Dome Roof -->
    <path d="M 44 19 Q 50 8 56 19 Z" fill="#1b1b22" stroke="#252530" stroke-width="1.5" />
    <!-- Light Glow Circle -->
    <circle cx="50" cy="25" r="3.5" fill="#ffd60a" />

    <defs>
        <linearGradient id="towerGradientHeader" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#2d2d3a" />
            <stop offset="50%" stop-color="#4a4a5e" />
            <stop offset="100%" stop-color="#1b1b22" />
        </linearGradient>
    </defs>
</svg>
